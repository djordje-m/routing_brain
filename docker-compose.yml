services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routing_brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routing_brain}
      POSTGRES_DB: ${POSTGRES_DB:-routing_brain}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-routing_brain}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routing_brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routing_brain}
      POSTGRES_DB: ${POSTGRES_DB:-routing_brain}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  traccar:
    image: traccar/traccar:6.17.0
    ports:
      - "${TRACCAR_WEB_PORT:-8082}:8082"
      - "${TRACCAR_OSMAND_PORT:-5055}:5055"
    environment:
      # Position forwarding to the backend's future /ingest/position route
      # (Task 5 implements the route; Task 4 only wires Traccar to call it).
      #
      # Verified live against traccar/traccar:6.17.0 (not from docs alone):
      # - Traccar DOES read config from environment variables, but only
      #   when CONFIG_USE_ENVIRONMENT_VARIABLES=true is also set (it is
      #   not the default for this image's bundled conf/traccar.xml). The
      #   mapping is: config key dots -> underscores, upper-cased, no
      #   prefix (e.g. forward.url -> FORWARD_URL).
      # - forward.type=json (FORWARD_TYPE) + forward.url (FORWARD_URL) is
      #   enough to forward every stored position via HTTP POST with a
      #   JSON body.
      #
      # Captured real payload (one truck, via the OsmAnd simulator) was:
      #   {
      #     "position": {
      #       "id": 0, "deviceId": 1, "protocol": "osmand",
      #       "serverTime": "...", "deviceTime": "...", "fixTime": "...",
      #       "valid": true, "latitude": 44.8, "longitude": 20.4,
      #       "altitude": 0.0, "speed": 10.0, "course": 90.0,
      #       "accuracy": 0.0, "attributes": {...}
      #     },
      #     "device": {
      #       "id": 1, "name": "truck-01", "uniqueId": "truck-01",
      #       "status": "online", ...
      #     }
      #   }
      #
      # Device-identifier decision: forward.type=json nests the full
      # Device object under "device", which carries "uniqueId" (our
      # "truck-01" string) directly alongside the numeric "position.deviceId"
      # / "device.id". This means Task 5's `get_truck_id_by_device` (keyed
      # on the traccar_device_id string) can read `device["uniqueId"]`
      # straight off the forwarded payload -- no deviceId->uniqueId cache
      # or admin-API lookup is needed. Position fields to parse: latitude,
      # longitude, speed (knots, per Traccar convention), course (this is
      # the heading field -- Traccar does not call it "heading"), and
      # fixTime (ISO-8601 string) as the recorded-at timestamp.
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      FORWARD_TYPE: "json"
      FORWARD_URL: "http://backend:8000/ingest/position"
    volumes:
      - traccar_data:/opt/traccar/data

  bootstrap:
    build: ./backend
    command: ["python", "bootstrap_traccar.py"]
    environment:
      TRACCAR_URL: "http://traccar:8082"
      TRACCAR_ADMIN_EMAIL: ${TRACCAR_ADMIN_EMAIL:-admin@routing-brain.local}
      TRACCAR_ADMIN_PASSWORD: ${TRACCAR_ADMIN_PASSWORD:-routing-brain}
    depends_on:
      - traccar
    restart: "no"

  simulator:
    build: ./simulator
    environment:
      TRACCAR_OSMAND_URL: "http://traccar:5055"
    ports:
      - "${SIMULATOR_PORT:-5001}:5001"
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE: "http://localhost:${BACKEND_PORT:-8000}"
      VITE_WS_URL: "ws://localhost:${BACKEND_PORT:-8000}/ws"
      VITE_STALE_THRESHOLD_SECONDS: "${STALE_THRESHOLD_SECONDS:-120}"

volumes:
  db_data:
  traccar_data:
