services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy

  traccar:
    image: traccar/traccar:latest
    ports:
      - "${TRACCAR_WEB_PORT}:8082"
      - "${TRACCAR_OSMAND_PORT}:5055"
    volumes:
      - traccar_data:/opt/traccar/data

  bootstrap:
    build: ./backend
    command: ["python", "bootstrap_traccar.py"]
    environment:
      TRACCAR_URL: "http://traccar:8082"
      TRACCAR_ADMIN_EMAIL: ${TRACCAR_ADMIN_EMAIL}
      TRACCAR_ADMIN_PASSWORD: ${TRACCAR_ADMIN_PASSWORD}
    depends_on:
      - traccar
    restart: "no"

  simulator:
    build: ./simulator
    environment:
      TRACCAR_OSMAND_URL: "http://traccar:5055"
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT}:5173"
    environment:
      VITE_API_BASE: "http://localhost:${BACKEND_PORT}"
      VITE_WS_URL: "ws://localhost:${BACKEND_PORT}/ws"

volumes:
  db_data:
  traccar_data:
